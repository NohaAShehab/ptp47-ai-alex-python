<text x="460" y="272" fill="#5C6570" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">The first parameter is the object. A dot call fills it. A bare class call does not.</text>
