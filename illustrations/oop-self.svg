<text x="460" y="60" fill="#B83232" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">on the class</text>
<text x="460" y="108" fill="#111111" font-size="14" font-weight="700" font-family="DejaVu Sans Mono, Liberation Mono, monospace" text-anchor="middle" dominant-baseline="central">Game.start_game()</text>
